name: Build unsigned desktop app

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            artifact: koodo-reader-macos-unsigned
          - platform: Windows
            os: windows-latest
            artifact: koodo-reader-windows-unsigned

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --network-timeout 1000000

      - name: Inject bundled plugin API key
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: node scripts/ci-inject-api-key.js

      - name: Configure unsigned macOS packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.build.mac.identity = null;
          packageJson.build.mac.notarize = false;
          packageJson.build.afterPack = "scripts/ci-ad-hoc-sign-mac.js";
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Build unsigned Windows package
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
        run: yarn release --win nsis zip --x64 --publish never

      - name: Build unsigned macOS package
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
        run: yarn release --mac dmg --arm64 --publish never

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  upload-modelscope-windows-zip:
    name: Upload Windows zip to ModelScope
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package artifact
        uses: actions/download-artifact@v6
        with:
          name: koodo-reader-windows-unsigned
          path: dist/windows

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ModelScope CLI
        run: python -m pip install --upgrade modelscope

      - name: Upload Windows zip to ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MODELSCOPE_API_TOKEN}" ]; then
            echo "MODELSCOPE_TOKEN secret is not set" >&2
            exit 1
          fi
          zip_path="$(find dist/windows -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "${zip_path}" ]; then
            echo "No Windows zip package found in downloaded artifact" >&2
            exit 1
          fi
          zip_name="$(basename "${zip_path}")"
          modelscope upload XXXXRT/111 "${zip_path}" "${zip_name}" \
            --repo-type model \
            --token "${MODELSCOPE_API_TOKEN}" \
            --commit-message "Upload Windows unsigned zip from ${GITHUB_SHA}"
