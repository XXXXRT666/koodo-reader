name: Build unsigned desktop app

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            artifact: koodo-reader-macos-unsigned
          - platform: Windows
            os: windows-latest
            artifact: koodo-reader-windows-unsigned

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --network-timeout 1000000

      - name: Inject bundled plugin API key
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: node scripts/ci-inject-api-key.js

      - name: Configure unsigned macOS packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.build.mac.identity = null;
          packageJson.build.mac.notarize = false;
          packageJson.build.afterPack = "scripts/ci-ad-hoc-sign-mac.js";
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Build unsigned Windows package
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
        run: yarn release --win nsis --x64 --publish never

      - name: Build unsigned macOS package
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
        run: yarn release --mac dmg --arm64 --publish never

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
